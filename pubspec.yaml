name: islamic_app
description: Offline Islamic App - Prayer Times & Quran Reader
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local Database ────────────────────────────────────────────
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Prayer Times (Offline) ───────────────────────────────────
  adhan: ^2.0.0+1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # ── Native Widgets ────────────────────────────────────────────
  home_widget: ^0.6.0
  workmanager: 0.10.10

  # ── Typography & UI ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # ── Utilities ─────────────────────────────────────────────────
  intl: 0.20.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3

  cupertino_icons: ^1.0.6
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
flutter:
  uses-material-design: true

  assets:
    - assets/database/
    - assets/fonts/
    - assets/images/
    - assets/audio/

  fonts:
    # Amiri – Arapça metinler için özel tipografi
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
        - asset: assets/fonts/Amiri-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700

