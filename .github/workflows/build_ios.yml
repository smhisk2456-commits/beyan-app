name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA for Sideloadly
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Stale Flutter Configs
        run: |
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          rm -rf ios/Flutter/ephemeral

      - name: Install Dependencies
        run: flutter pub get

      - name: Add Lock Screen Widget Extension Target
        run: |
          sudo gem install xcodeproj --no-document
          ruby tools/add_ios_widget_target.rb

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign --verbose

      - name: Verify Widget Is Embedded
        run: |
          ls -la build/ios/iphoneos/Runner.app/PlugIns/
          test -d build/ios/iphoneos/Runner.app/PlugIns/BeyanWidgetExtension.appex

      - name: Package into IPA for Sideloadly
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -a build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Beyan.ipa Payload
          echo "IPA Created Successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beyan-iOS-IPA
          path: build/ios/ipa/Beyan.ipa
          retention-days: 7
